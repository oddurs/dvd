name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Run tests before release
        run: go test -race ./...
      - name: Build release archives
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 freebsd/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE="dvd_${VERSION#v}_${GOOS}_${GOARCH}"
            mkdir -p "dist/${STAGE}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/${STAGE}/dvd" .
            cp LICENSE README.md dvd.1 "dist/${STAGE}/"
            tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
            rm -rf "dist/${STAGE}"
          done
          for target in windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE="dvd_${VERSION#v}_${GOOS}_${GOARCH}"
            mkdir -p "dist/${STAGE}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/${STAGE}/dvd.exe" .
            cp LICENSE README.md "dist/${STAGE}/"
            (cd dist && zip -qr "${STAGE}.zip" "${STAGE}")
            rm -rf "dist/${STAGE}"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
